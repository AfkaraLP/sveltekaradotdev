services:
  sveltekaradotdev:
    build: .
    ports:
      - "6701:3000"
    restart: unless-stopped

  dev:
    image: docker.io/node:25-alpine3.22
    working_dir: /app
    command: sh -c "yarn install && yarn dev --host 0.0.0.0"
    ports:
      - "6701:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

volumes:
  node_modules:
